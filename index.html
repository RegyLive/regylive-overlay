<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RegyLive Twitch Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

  body {
    margin: 0;
    background-color: #1e1e2f;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Orbitron', sans-serif;
    overflow: hidden;
  }

  .container {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  /* Twitch Logo SVG Styling */
  .twitch-logo {
    width: 100px;
    height: 100px;
    animation: bounce 2s infinite;
    filter: drop-shadow(0 0 5px #9147ff);
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  /* RegyLive Text Animation */
  .regylive-text {
    font-size: 3.5rem;
    color: #9147ff;
    animation: pulseColor 3s infinite alternate;
    user-select: none;
  }

  @keyframes pulseColor {
    0% {
      color: #9147ff;
      text-shadow: 0 0 10px #9147ff;
    }
    100% {
      color: #7a36d1;
      text-shadow: 0 0 20px #7a36d1;
    }
  }
</style>
</head>
<body>

<div class="container">
  <!-- Twitch SVG Logo -->
  <svg class="twitch-logo" viewBox="0 0 24 24" fill="#9147ff" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img">
    <path d="M2 2v16h5v4l4-4h5l5-5V2H2zM20 13l-4 4h-5l-2 2v-2H4V4h16v9z"/>
  </svg>

  <!-- Animated Text -->
  <div class="regylive-text">RegyLive</div>
</div>

</body>
</html>
