
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>RegyLive Overlay</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }
    .container {
      display: flex;
      align-items: center;
      animation: fadeIn 2s ease-in-out;
      padding: 10px;
    }
    img {
      height: 64px;
      animation: slideIn 1.5s ease-out;
    }
    .text {
      font-family: Arial, sans-serif;
      font-size: 48px;
      color: #9147FF;
      margin-left: 12px;
      opacity: 0;
      animation: textFadeIn 2s ease-in 1s forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideIn {
      from { transform: translateX(-100px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes textFadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://static-cdn.jtvnw.net/jtv_user_pictures/panel-1337-official-twitchlogo-image-b38e6c6e9c79e9f3-320-320.png" alt="Twitch Logo">
    <div class="text">RegyLive</div>
  </div>
</body>
</html>
